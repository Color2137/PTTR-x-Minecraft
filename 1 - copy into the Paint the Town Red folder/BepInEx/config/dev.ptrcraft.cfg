## Settings file was created by plugin PTRCraft v0.1.9
## Plugin GUID: dev.ptrcraft

[Combat]

## PTR damage per Minecraft damage point (a biker has about 1.0 health)
# Setting type: Single
# Default value: 0.11
MinecraftToPtrDamage = 0.11

## PTR damage added to every Minecraft hit (a bare-fist punch = 0.23, about 4 to drop a biker)
# Setting type: Single
# Default value: 0.12
MinecraftToPtrDamageBase = 0.12

## Minecraft damage per PTR damage dealt to the player (full PTR health = 10 hearts)
# Setting type: Single
# Default value: 20
PtrToMinecraftDamage = 20

## Dying in Minecraft kills PTR's player too: PTR's own death screen and restart (or the end of a Beneath run)
# Setting type: Boolean
# Default value: true
MinecraftDeathEndsPtrLevel = true

## How far Minecraft hits push PTR's people (scenarios, arena, custom levels)
# Setting type: Single
# Default value: 1
Knockback = 1

## The same in Beneath, whose enemies PTR itself pushes about ten times less (they flew off the map at 1.0)
# Setting type: Single
# Default value: 0.1
KnockbackBeneath = 0.1

## Minecraft fire (fire, lava, campfires, magma, Fire Aspect, Flame arrows) sets PTR's people burning with PTR's own fire, like the arena's fire traps
# Setting type: Boolean
# Default value: true
MinecraftFireBurnsPtr = true

[Debug]

## Local debug console on 127.0.0.1
# Setting type: Boolean
# Default value: true
DevBridge = false

## Debug console port
# Setting type: Int32
# Default value: 47347
DevPort = 47347

[Display]

## Minecraft draws its hand and HUD at most this tall; PTR scales it up
# Setting type: Int32
# Default value: 1080
OverlayMaxHeight = 1080

## How often Minecraft renders its hand and HUD (PTR's camera never waits)
# Setting type: Int32
# Default value: 75
MinecraftMaxFps = 75

## Hide PTR's health bar, power icons and key prompts while Minecraft's HUD is shown
# Setting type: Boolean
# Default value: true
HidePtrHud = true

## Minecraft draws its own blocks, mobs, players, arrows, items, particles and your F5 body into the overlay, hidden behind PTR's walls and people; off: PTR draws Minecraft's blocks and entities itself with PTR's lights
# Setting type: Boolean
# Default value: true
MinecraftDrawsWorld = true

[General]

## Replace PTR's player with the Minecraft player while Minecraft is linked
# Setting type: Boolean
# Default value: true
Enabled = true

[Minecraft]

## Start the PTRCraft Minecraft (hidden) when PTR starts, unless one is already running
# Setting type: Boolean
# Default value: true
StartWithPTR = true

## Prism Launcher exe; empty = %LOCALAPPDATA%\Programs\PrismLauncher\prismlauncher.exe
# Setting type: String
# Default value: 
Launcher = 

## Arguments that start the PTRCraft instance
# Setting type: String
# Default value: --launch PTRCraft
Arguments = --launch PTRCraft

